<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story Mapper</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <!-- Cytoscape skips injecting its inline <style> when this id exists, keeping the CSP strict.
       Its rule (position: relative on the container) is covered by .map in app.css. -->
  <meta id="__________cytoscape_stylesheet" name="cytoscape-style" content="provided-by-app-css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="5" cy="5" r="2.5"/><circle cx="19" cy="9" r="2.5"/><circle cx="7" cy="19" r="2.5"/><path d="M7 6.2 16.8 8.4M5.6 7.4l1 9.2M17.6 11 9 17.6" fill="none" stroke-width="1.6"/></svg>
      <span>Story Mapper</span>
    </div>
    <label class="story-picker">
      <span class="visually-hidden">Current story</span>
      <select id="story-select"></select>
    </label>
    <div class="toolbar">
      <button class="btn" id="btn-new" type="button">+ New story</button>
      <button class="btn" id="btn-import" type="button">Import</button>
      <button class="btn" id="btn-export" type="button" data-needs-story>Export JSON</button>
      <input type="file" id="file-import" accept="application/json,.json" hidden>
    </div>
    <label class="search">
      <span class="visually-hidden">Search scenes</span>
      <input id="search" type="search" placeholder="Search scenes  /" data-needs-story>
    </label>
    <span id="save-state" class="save-state" role="status" aria-live="polite"></span>
    <button class="btn btn-primary" id="btn-play" type="button" data-needs-story title="Play-test from the start (P)">▶ Play-test</button>
  </header>

  <main class="layout">
    <aside class="sidebar" aria-label="Story overview">
      <div id="sidebar"></div>
      <div class="sidebar-foot">
        <button class="link danger small" id="btn-delete-story" type="button" data-needs-story>Delete this story</button>
      </div>
    </aside>

    <section class="map-wrap" aria-label="Story map">
      <div class="map-tools">
        <button class="btn" id="btn-add" type="button" data-needs-story title="Add scene (N)">+ Scene</button>
        <button class="btn" id="btn-layout" type="button" data-needs-story title="Arrange as a tree from the start scene">Auto-arrange</button>
        <button class="btn" id="btn-fit" type="button" data-needs-story>Fit</button>
        <button class="btn" id="btn-png" type="button" data-needs-story>Save PNG</button>
      </div>
      <div id="cy" class="map"></div>
      <div id="empty-state" class="empty-state" hidden>
        <h2>No stories yet</h2>
        <p>Start mapping your choose-your-own-adventure.</p>
        <button class="btn btn-primary" id="btn-empty-new" type="button">Create a story</button>
      </div>
    </section>

    <aside class="inspector" id="inspector" aria-label="Scene editor"></aside>
  </main>

  <section id="player" class="player" aria-label="Play-test" hidden></section>
  <div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>
